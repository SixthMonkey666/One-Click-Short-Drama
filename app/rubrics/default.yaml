version: "v1.0"
name: "默认多模态评测 Rubric"
task_type: "universal"
description: "适用于关键帧、角色图、场景图、合成视频等多模态产出的通用评测标准"

bad_case_tags:
  - "指令未遵循"
  - "主体缺失"
  - "主体/角色漂移"
  - "属性错误"
  - "场景跳变"
  - "构图异常"
  - "肢体或物理错误"
  - "文字错误"
  - "风格不一致"
  - "画面瑕疵"
  - "镜头重复"
  - "动作不连贯"
  - "跨帧闪烁"
  - "Prompt幻觉"
  - "其他"

dimensions:
  - key: "instruction_following"
    label: "指令遵循"
    weight: 1.0
    required: true
    anchors:
      1: "严重偏离Prompt核心要求，关键主体、动作或场景完全错误"
      2: "明显遗漏核心要素，主体存在但关键属性/动作错误"
      3: "基本遵循Prompt，主要要素齐全但细节偏差明显"
      4: "较好遵循指令，核心与大部分细节准确，仅次要元素有偏差"
      5: "完美遵循Prompt，所有关键和次要要素均准确呈现"

  - key: "content_correctness"
    label: "内容正确性"
    weight: 1.0
    required: true
    anchors:
      1: "内容存在事实性错误或常识性错误，严重误导"
      2: "多处明显事实/常识错误，物体关系或空间逻辑错误"
      3: "基本内容正确，存在少量非关键错误"
      4: "内容准确，几乎无错误，细节符合常识"
      5: "内容完全正确，细节精确，逻辑自洽"

  - key: "character_consistency"
    label: "角色一致性"
    weight: 1.0
    required: false
    anchors:
      1: "角色外观、服装、年龄、性别等完全无法识别或错误"
      2: "角色有明显漂移，服装/发色/五官等关键特征不一致"
      3: "角色基本可识别，但细节特征（服装纹理、配饰）有偏差"
      4: "角色一致性良好，关键特征稳定，仅微小差异"
      5: "角色特征完全一致，跨图/跨帧高度统一"

  - key: "scene_consistency"
    label: "场景一致性"
    weight: 0.8
    required: false
    anchors:
      1: "场景完全错误或跳变，与描述完全不符"
      2: "场景主要元素（地点、时间、天气）明显不符"
      3: "场景基本正确，色调/光线/部分物体有偏差"
      4: "场景一致性良好，环境氛围准确，仅细微差别"
      5: "场景完全一致，光影、时间、氛围与描述精确匹配"

  - key: "composition_quality"
    label: "构图与视觉质量"
    weight: 1.0
    required: true
    anchors:
      1: "构图混乱，主体不突出，画质极差，严重影响观看"
      2: "构图存在明显问题（主体偏离、比例失调、画面杂乱）"
      3: "构图基本合理，主体可辨，画质中等，存在瑕疵"
      4: "构图良好，主体突出，画质清晰，审美在线"
      5: "构图优秀，画面精美，画质细腻，具有电影感"

  - key: "shot_usability"
    label: "镜头可用性"
    weight: 1.0
    required: true
    anchors:
      1: "完全不可用，镜头内容无法用于后续制作"
      2: "需要大幅修改或重新生成才能使用"
      3: "基本可用，但需要一定后期调整或局部修复"
      4: "可以直接使用，仅需轻微调色或裁剪"
      5: "完全可用，镜头表现优秀，无需任何修改"

  - key: "narrative_coherence"
    label: "时序/叙事连贯性"
    weight: 0.8
    required: false
    anchors:
      1: "叙事完全断裂，镜头间无逻辑关联"
      2: "叙事混乱，时间线或因果关系有明显错误"
      3: "叙事基本连贯，但镜头衔接有跳跃或过渡不自然"
      4: "叙事流畅，镜头衔接自然，故事线清晰"
      5: "叙事完美流畅，节奏得当，镜头衔接丝滑"

  - key: "text_accuracy"
    label: "文字与字幕准确性"
    weight: 0.5
    required: false
    anchors:
      1: "文字完全乱码或含义完全错误"
      2: "文字明显错误、拼写错误多或含义偏差大"
      3: "文字基本可读，存在少量错别字或排版问题"
      4: "文字准确，排版清晰，无明显错误"
      5: "文字完全准确，排版精美，字体风格匹配"

  - key: "frame_stability"
    label: "跨帧稳定性"
    weight: 0.8
    required: false
    anchors:
      1: "严重闪烁、变形或主体跳变，无法观看"
      2: "明显闪烁、抖动或主体忽大忽小"
      3: "存在轻微抖动或闪烁，但整体可接受"
      4: "帧间稳定，几乎无闪烁或抖动"
      5: "帧间完全稳定，运动平滑自然"

  - key: "overall_usability"
    label: "整体可用性"
    weight: 1.2
    required: true
    anchors:
      1: "完全不可用，必须重新生成"
      2: "问题较多，需要大改或重生"
      3: "基本可用，有明显瑕疵但整体意思到位"
      4: "质量较好，可进入下一环节，仅需微调"
      5: "表现优秀，可直接交付使用"
