name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      IMAGE_PROVIDER: mock
      VIDEO_PROVIDER: mock
      JUDGE_PROVIDER: mock
      APP_DATA_DIR: .ci-data
      HOT_TOPIC_SEARCH_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Mock test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.12.5

      - name: Lint
        run: ruff check app streamlit_app.py tests

      - name: Compile
        run: python -m compileall -q app streamlit_app.py tests

      - name: Check dependencies
        run: python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Docker image
        run: docker build --tag storyboard-flow-ci .
