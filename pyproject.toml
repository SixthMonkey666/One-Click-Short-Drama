[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "I"]
ignore = [
    "B008",
    "S101",
    "E501",
    "S110",
    "S311",
    "S603",
    "S607",
    "S310",
    "S108",
    "S112",
    "S324",
    "B023",
    "B027",
    "B007",
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011", "F811"]
